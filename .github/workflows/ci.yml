name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # pyepics is a hard dependency and installs here, but nothing in the
      # default test run may open a Channel Access socket: the suite uses
      # FakeBackend, and anything needing a real IOC is marked `ioc` and
      # deselected by `addopts` in pyproject.toml. See CONTRIBUTING.md.
      - name: Install package (dev extra)
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      # A CA broadcast from a CI runner goes nowhere, but making the
      # intention explicit costs one line and documents the guarantee.
      - name: Pytest
        env:
          EPICS_CA_AUTO_ADDR_LIST: "NO"
          EPICS_CA_ADDR_LIST: ""
        run: pytest -v

  # Validates the artifact people actually install, which the job above does
  # not: it runs against an editable install of the source tree, so a
  # subpackage missing from the wheel or an unresolvable dependency passes
  # every test and still breaks `pip install epics-mcp`. One cheap job, one
  # OS -- packaging errors of this kind are not platform-specific.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the wheel and sdist
        run: |
          pip install build
          python -m build

      - name: Install the built wheel into a clean environment
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl

      - name: Verify the installed package imports
        run: |
          /tmp/wheel-check/bin/python -c "import epics_mcp; print(epics_mcp.__version__)"

      - name: Verify the console script runs
        run: /tmp/wheel-check/bin/epics-mcp --help > /dev/null

      # PLAN.md 4.2: "no policy, no PVs" -- the server refuses to start
      # without one. Asserted here at the packaging level, not just in the
      # unit tests, because this is the one guarantee a reviewer should be
      # able to check without reading any code.
      - name: Verify no --policy refuses to start (exit 2)
        run: |
          set +e
          EPICS_MCP_POLICY= /tmp/wheel-check/bin/epics-mcp --check
          status=$?
          set -e
          test "$status" -eq 2

      - name: pip check (declared dependencies actually resolve)
        run: /tmp/wheel-check/bin/pip check
